<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Caisses — Hellfest 2026</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --txt:#f2f4f8; --muted:#9aa3b2;
    --pitcher:#f4d000; --pitcher-txt:#1a1a00;
    --cup60:#e6007e; --cup60-txt:#fff;
    --cup33:#00a651; --cup33-txt:#fff;
    --cup28:#1d4ed8; --cup28-txt:#fff;
    --vide:#6b7280; --vide-txt:#fff;
    --autre:#374151; --autre-txt:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    touch-action:manipulation}
  header{padding:14px 16px;text-align:center;border-bottom:1px solid #262a33}
  header h1{margin:0;font-size:17px;letter-spacing:.5px}
  header .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:60px}
  .controls{display:flex;gap:10px;margin:14px 0}
  button{flex:1;padding:14px;font-size:15px;font-weight:600;border:none;
    border-radius:12px;background:var(--card);color:var(--txt);cursor:pointer}
  button.primary{background:#3b82f6}
  button:active{opacity:.7}
  .manual{display:flex;gap:8px;margin:10px 0}
  .manual input{flex:1;padding:14px;font-size:16px;border-radius:12px;border:1px solid #333;
    background:var(--card);color:var(--txt)}
  .result{margin-top:18px;border-radius:18px;overflow:hidden;display:none}
  .result.show{display:block;animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .visual{padding:30px 20px;text-align:center}
  .visual .kind{font-size:34px;font-weight:800;line-height:1.1}
  .visual .code{font-size:13px;opacity:.8;margin-top:6px;font-family:monospace}
  .dest{background:var(--card);padding:22px 20px;text-align:center}
  .dest .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .dest .bar{font-size:26px;font-weight:800;margin:6px 0 0}
  .dest .meta{font-size:15px;color:var(--muted);margin-top:10px}
  .notfound{background:#7f1d1d;color:#fff;padding:26px 20px;text-align:center;
    border-radius:18px;margin-top:18px;display:none}
  .notfound.show{display:block}
  .notfound .big{font-size:22px;font-weight:800}
  .v-PITCHER{background:var(--pitcher);color:var(--pitcher-txt)}
  .v-CUP60{background:var(--cup60);color:var(--cup60-txt)}
  .v-CUP33{background:var(--cup33);color:var(--cup33-txt)}
  .v-CUP28{background:#1d4ed8;color:#fff}
  .v-VIDE{background:var(--vide);color:var(--vide-txt)}
  .v-AUTRE{background:var(--autre);color:var(--autre-txt)}
  .hist{margin-top:24px}
  .hist h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
  .hist .row{display:flex;justify-content:space-between;padding:10px 12px;background:var(--card);
    border-radius:10px;margin-bottom:6px;font-size:14px;align-items:center}
  .hist .row .c{font-family:monospace;font-size:12px;color:var(--muted)}
  .tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .footer{text-align:center;color:#4b5563;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>SCAN CAISSES — HELLFEST 2026</h1>
  <div class="sub">3155 caisses référencées</div>
</header>
<div class="wrap">
  <div id="reader"></div>
  <div class="controls">
    <button id="startBtn" class="primary">▶ Démarrer la caméra</button>
    <button id="stopBtn">⏹ Stop</button>
  </div>
  <div class="manual">
    <input id="manualInput" type="text" placeholder="Saisie manuelle (ex. KA-00028 ou 28)" inputmode="text">
    <button id="manualBtn" style="flex:0 0 90px">OK</button>
  </div>

  <div id="result" class="result">
    <div id="visual" class="visual">
      <div class="kind" id="vKind"></div>
      <div class="code" id="vCode"></div>
    </div>
    <div class="dest">
      <div class="lbl">Destination</div>
      <div class="bar" id="vBar"></div>
      <div class="meta" id="vMeta"></div>
    </div>
  </div>

  <div id="notfound" class="notfound">
    <div class="big">❌ Code inconnu</div>
    <div id="nfCode" style="font-family:monospace;margin-top:8px"></div>
  </div>

  <div class="hist">
    <h3>Historique</h3>
    <div id="histList"></div>
  </div>
</div>
<div class="footer">Données embarquées · fonctionne hors-ligne</div>

// Index normalisé pour recherche tolérante
const INDEX = {};
function norm(s){ return String(s).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function numKey(s){ const m=String(s).match(/(\d+)/g); return m? m.join('').replace(/^0+/,''):''; }
for(const ref in DATA){
  INDEX[norm(ref)] = ref;            // KA00028
  const nk = numKey(ref);            // 28
  if(nk && !(nk in INDEX)) INDEX['#'+nk]=ref;
}
function lookup(raw){
  if(!raw) return null;
  const n = norm(raw);
  if(INDEX[n]) return DATA[INDEX[n]];
  const nk = numKey(raw);
  if(nk && INDEX['#'+nk]) return DATA[INDEX['#'+nk]];
  // tente avec préfixe KA
  if(INDEX['KA'+n]) return DATA[INDEX['KA'+n]];
  return null;
}

function vClass(v){
  if(v==='PITCHER 1,6L')return'v-PITCHER';
  if(v==='CUP 60cl')return'v-CUP60';
  if(v==='CUP 33cl')return'v-CUP33';
  if(v==='CUP 28cl')return'v-CUP28';
  if(v==='VIDE')return'v-VIDE';
  return'v-AUTRE';
}

const result=document.getElementById('result');
const notfound=document.getElementById('notfound');
const histList=document.getElementById('histList');
let lastCode='', lastTime=0;

function beep(ok){
  try{const c=new(window.AudioContext||window.webkitAudioContext)();
    const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);
    o.frequency.value=ok?880:220;o.start();g.gain.setValueAtTime(.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.stop(c.currentTime+.2);}catch(e){}
}

function show(raw){
  const now=Date.now();
  if(raw===lastCode && now-lastTime<2500) return;
  lastCode=raw; lastTime=now;
  const d=lookup(raw);
  if(d){
    beep(true);
    if(navigator.vibrate)navigator.vibrate(60);
    const vis=document.getElementById('visual');
    vis.className='visual '+vClass(d.v);
    document.getElementById('vKind').textContent=d.v;
    document.getElementById('vCode').textContent=raw;
    document.getElementById('vBar').textContent=d.bar;
    document.getElementById('vMeta').textContent=d.prod+(d.qty!==''?' · '+d.qty+' u.':'');
    result.classList.add('show'); notfound.classList.remove('show');
    addHist(raw,d);
  }else{
    beep(false);
    if(navigator.vibrate)navigator.vibrate([60,40,60]);
    document.getElementById('nfCode').textContent=raw;
    notfound.classList.add('show'); result.classList.remove('show');
  }
}

function addHist(code,d){
  const row=document.createElement('div');row.className='row';
  row.innerHTML='<div><div>'+d.bar+'</div><div class="c">'+code+'</div></div>'+
    '<span class="tag '+vClass(d.v)+'">'+d.v+'</span>';
  histList.prepend(row);
  while(histList.children.length>15)histList.removeChild(histList.lastChild);
}

// Scanner
let scanner=null, running=false;
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
startBtn.onclick=async()=>{
  if(running)return;
  scanner=new Html5Qrcode("reader");
  try{
    await scanner.start({facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:140},
       formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,
         Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
         Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.QR_CODE,
         Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR]},
      (txt)=>show(txt.trim()), ()=>{});
    running=true; startBtn.textContent='● Caméra active';
  }catch(e){alert('Caméra indisponible : '+e);}
};
stopBtn.onclick=async()=>{
  if(scanner&&running){await scanner.stop();running=false;startBtn.textContent='▶ Démarrer la caméra';}
};

// Saisie manuelle
const mi=document.getElementById('manualInput');
document.getElementById('manualBtn').onclick=()=>{if(mi.value.trim()){show(mi.value.trim());mi.value='';}};
mi.addEventListener('keydown',e=>{if(e.key==='Enter'){document.getElementById('manualBtn').click();}});
</script>
